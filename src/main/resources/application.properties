# =======================================================
# SERVER SETTINGS
# =======================================================
server.port=8080
server.address=0.0.0.0
spring.application.name=ProjectTrackerBackend

# =======================================================
# DATABASE CONNECTION (PostgreSQL - Supabase)
# Fail-fast: No hardcoded credential fallbacks!
# =======================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================================================
# FLYWAY MIGRATION
# =======================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# =======================================================
# JPA / HIBERNATE CONFIGURATION
# Validate against Flyway schema (no silent schema drift)
# =======================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =======================================================
# SECURITY & JWT CONFIGURATION
# Fail-fast: Secret must be provided via environment
# =======================================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=28800000

# =======================================================
# CORS CONFIGURATION
# =======================================================
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# =======================================================
# FILE UPLOAD LIMITS
# =======================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =======================================================
# SWAGGER / OPENAPI
# =======================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =======================================================
# SPRING BOOT ACTUATOR (OBSERVABILITY)
# Uptime check is public, deep telemetry requires auth
# =======================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# =======================================================
# CAFFEINE IN-MEMORY CACHE
# =======================================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

